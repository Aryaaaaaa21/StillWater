name: Stillwater release build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and verify Compact compiler 0.31.1
        run: |
          bash scripts/install-compact.sh
          echo "$HOME/.compact/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Compile and test
        run: npm run compile && npm test
      - name: Typecheck root and frontend
        run: npm run typecheck
      - name: Build deployment artifact
        run: npm run build
      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: stillwater-frontend
          path: frontend/dist
